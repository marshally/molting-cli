[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[project]
name = "molting-cli"
version = "0.1.0"
description = "CLI tool for Python refactorings from Martin Fowler's catalog"
authors = [{ name = "Marshall Yount", email = "your-email@example.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<4"
dependencies = [
    "click>=8.0.0,<9",
    "libcst>=1.0.0,<2",
    "rich>=13.0.0,<14",
    "rope>=1.9.0,<2",
]

[dependency-groups]
dev = [
    "black>=23.0.0,<24",
    "mypy>=1.0.0,<2",
    "pytest>=7.0.0,<8",
    "pytest-cov>=4.0.0,<5",
    "ruff>=0.1.0,<0.2",
]

[project.scripts]
molting = "molting.cli:main"

[tool.uv.build-backend]
module-name = "molting"
module-root = ""

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
extend-exclude = 'tests/fixtures/'

[tool.ruff]
line-length = 100
exclude = ["tests/fixtures/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
